name: Post to Bluesky

on:
  push:
    branches: [main]
    paths:
      - 'src/content/articles/**/*.mdx'
  workflow_dispatch:
    inputs:
      file:
        description: 'Article file path to post (e.g. src/content/articles/my-article.mdx)'
        required: true
      dry_run:
        description: 'Print the posts instead of publishing them'
        type: boolean
        default: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find new articles
        id: find
        env:
          INPUT_FILE: ${{ github.event.inputs.file }}
        run: |
          if [ -n "$INPUT_FILE" ]; then
            FILES="$INPUT_FILE"
          else
            FILES=$(git diff --name-status HEAD~1 HEAD | grep '^A' | grep 'src/content/articles/.*\.mdx' | awk '{print $2}' | tr '\n' ' ')
          fi
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Post to Bluesky
        if: steps.find.outputs.files != ''
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          SITE_URL: https://jethromay.com
          NEW_ARTICLE_FILES: ${{ steps.find.outputs.files }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node .github/scripts/post-to-bluesky.js
